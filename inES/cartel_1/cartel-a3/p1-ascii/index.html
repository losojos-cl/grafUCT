<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P1 — Campo ASCII · A3</title>
  <style>
    @font-face {
      font-family: 'Terminal Grotesque';
      src: url('../lib/fonts/terminal-grotesque.otf') format('opentype');
      font-display: swap;
    }
    :root { --fondo: #111; --tinta: #fafafa; --suave: #8a8a8a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fondo); color: var(--tinta);
           font-family: 'Terminal Grotesque', monospace; display: flex; gap: 24px;
           justify-content: center; align-items: flex-start; padding: 24px; }
    canvas { box-shadow: 0 0 40px rgba(0,0,0,.6);
            width: auto !important; height: auto !important;
            max-height: 92vh; max-width: 100%; }
    aside { width: 250px; position: sticky; top: 24px; border: 1px solid #333;
            padding: 18px; font-size: 12px; display: flex; flex-direction: column; gap: 14px; }
    aside h1 { font-size: 13px; font-weight: normal; letter-spacing: 2px; margin: 0; }
    aside a.indice { color: var(--suave); text-decoration: none; }
    .fila { display: flex; flex-direction: column; gap: 4px; }
    .fila label { color: var(--suave); display: flex; justify-content: space-between; }
    select, input[type=number], input[type=text], button { font-family: 'Terminal Grotesque', monospace; font-size: 12px;
      background: #1c1c1c; color: var(--tinta); border: 1px solid #444; padding: 6px; width: 100%; }
    input[type=range] { width: 100%; }
    input[type=file] { font-size: 11px; color: var(--suave); }
    .modos { display: flex; gap: 12px; }
    button { cursor: pointer; }
    button.principal { border-color: var(--tinta); padding: 10px; }
    .hint { color: var(--suave); font-size: 11px; line-height: 1.7; }
    hr { border: 0; border-top: 1px solid #333; width: 100%; margin: 2px 0; }
    .seccion { color: var(--tinta); font-size: 12px; letter-spacing: 2px; }
    #listaPresets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  </style>
</head>
<body>
  <main id="lienzo"></main>
  <aside>
    <h1>P1 · CAMPO ASCII</h1>
    <a class="indice" href="../">← índice</a>

    <div class="fila">
      <label>Paleta (C)</label>
      <select id="selPaleta"></select>
    </div>
    <div class="fila">
      <label>Tipografía (T)</label>
      <select id="selTipo"></select>
    </div>
    <div class="fila">
      <label>Celda <span id="vCelda"></span></label>
      <input id="inCelda" type="range" min="5" max="16" step="0.5" value="9">
    </div>
    <div class="fila">
      <label>Umbral <span id="vUmbral"></span></label>
      <input id="inUmbral" type="range" min="0" max="0.8" step="0.01" value="0.35">
    </div>
    <div class="fila">
      <label>Frontera <span id="vFrontera"></span></label>
      <input id="inFrontera" type="range" min="0.05" max="0.6" step="0.01" value="0.30">
    </div>
    <div class="fila">
      <label>Suavidad <span id="vSuavidad"></span></label>
      <input id="inSuavidad" type="range" min="0.02" max="0.4" step="0.01" value="0.18">
    </div>
    <div class="fila">
      <label>Semilla (R regenera)</label>
      <div style="display:flex; gap:8px;">
        <input id="inSemilla" type="number" value="1" min="1" max="9999">
        <button id="btnSemilla" style="width:auto;">↻</button>
      </div>
    </div>
    <div class="fila">
      <label>Campo</label>
      <div class="modos">
        <label><input type="radio" name="modo" value="huella" checked> huella</label>
        <label><input type="radio" name="modo" value="retrato"> retrato</label>
        <label><input type="radio" name="modo" value="imagen"> imagen</label>
      </div>
      <input id="inArchivo" type="file" accept="image/*">
    </div>
    <hr>
    <div class="seccion">PRIMITIVOS</div>
    <div class="fila">
      <label>Umbral punto <span id="vUPunto"></span></label>
      <input id="inUPunto" type="range" min="0.3" max="0.9" step="0.01" value="0.62">
    </div>
    <div class="fila">
      <label>Punto max <span id="vDotMax"></span></label>
      <input id="inDotMax" type="range" min="0.3" max="1.6" step="0.05" value="1.1">
    </div>
    <div class="fila">
      <label>Scan cada <span id="vScanCada"></span></label>
      <input id="inScanCada" type="range" min="1" max="6" step="1" value="3">
    </div>
    <div class="fila">
      <label>Scan largo <span id="vScanLen"></span></label>
      <input id="inScanLen" type="range" min="2" max="14" step="1" value="6">
    </div>
    <div class="fila">
      <label>Scan prob <span id="vScanProb"></span></label>
      <input id="inScanProb" type="range" min="0" max="1" step="0.05" value="0.5">
    </div>
    <div class="fila">
      <label>Cuad densidad <span id="vSqDens"></span></label>
      <input id="inSqDens" type="range" min="0" max="0.5" step="0.01" value="0.08">
    </div>
    <div class="fila">
      <label>Cuad max <span id="vSqMax"></span></label>
      <input id="inSqMax" type="range" min="0.2" max="1.2" step="0.05" value="0.5">
    </div>
    <hr>
    <div class="seccion">VISTA</div>
    <div class="fila">
      <label>Zoom <span id="vZoom"></span></label>
      <input id="inZoom" type="range" min="0.5" max="3" step="0.05" value="1">
    </div>
    <div class="fila">
      <label>Despl X <span id="vOx"></span></label>
      <input id="inOx" type="range" min="-0.5" max="0.5" step="0.01" value="0">
    </div>
    <div class="fila">
      <label>Despl Y <span id="vOy"></span></label>
      <input id="inOy" type="range" min="-0.5" max="0.5" step="0.01" value="0">
    </div>
    <hr>
    <div class="seccion">ANIMACIÓN</div>
    <button id="btnPlay">▶ Animar (Espacio)</button>
    <div class="hint" id="indRes">preview full · export full</div>
    <div class="fila">
      <label>Deriva <span id="vVel"></span></label>
      <input id="inVel" type="range" min="0" max="0.3" step="0.005" value="0.05">
    </div>
    <div class="fila">
      <label>Amplitud barrido <span id="vAmp"></span></label>
      <input id="inAmp" type="range" min="0" max="0.25" step="0.01" value="0.06">
    </div>
    <div class="fila">
      <label>Periodo <span id="vPeriodo"></span></label>
      <input id="inPeriodo" type="range" min="30" max="1200" step="10" value="240">
    </div>
    <hr>
    <div class="seccion">PRESETS</div>
    <div class="fila">
      <div style="display:flex; gap:8px;">
        <input id="inPresetNombre" type="text" placeholder="nombre…" style="flex:1;">
        <button id="btnGuardarPreset" style="width:auto;">💾</button>
      </div>
    </div>
    <ul id="listaPresets"></ul>
    <div class="fila">
      <div style="display:flex; gap:8px;">
        <button id="btnExportPresets" style="flex:1;">Exportar JSON</button>
        <button id="btnImportPresets" style="flex:1;">Importar JSON</button>
      </div>
      <input id="inImportPresets" type="file" accept=".json,application/json" style="display:none;">
    </div>
    <button id="btnSVG" class="principal">Descargar SVG (S)</button>
    <div class="hint">?paleta=N&tipo=M<br>fija el tema por URL</div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="../lib/p5.svg.min.js"></script>
  <script src="../lib/tema.js"></script>
  <script src="../lib/presets.js"></script>
  <script src="ascii.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
