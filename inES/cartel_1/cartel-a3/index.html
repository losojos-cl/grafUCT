<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartel 1 — Propuestas</title>
  <style>
    @font-face {
      font-family: 'Terminal Grotesque';
      src: url('lib/fonts/terminal-grotesque.otf') format('opentype');
      font-display: swap;
    }
    :root { --fondo: #111; --tinta: #fafafa; --suave: #8a8a8a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fondo); color: var(--tinta);
           font-family: 'Terminal Grotesque', monospace; min-height: 100vh;
           display: flex; flex-direction: column; align-items: center; padding: 48px 20px; }
    h1 { font-size: 20px; font-weight: normal; letter-spacing: 2px; margin: 0 0 8px; }
    p.sub { color: var(--suave); font-size: 13px; margin: 0 0 40px; }
    .grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .card { width: 240px; border: 1px solid #333; padding: 24px 20px; text-decoration: none;
            color: var(--tinta); display: block; transition: border-color .2s; }
    .card:hover { border-color: var(--tinta); }
    .card.pendiente { opacity: .4; }
    .card .num { font-size: 12px; color: var(--suave); letter-spacing: 2px; }
    .card h2 { font-size: 16px; font-weight: normal; margin: 12px 0 8px; }
    .card p { font-size: 12px; color: var(--suave); margin: 0; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>CARTEL 1 — A3</h1>
  <p class="sub">inES · tres propuestas · p5.js + SVG</p>
  <div class="grid">
    <a class="card" href="p1-ascii/">
      <div class="num">P1</div>
      <h2>Campo ASCII</h2>
      <p>Teclado → disolución → lema.<br>Fondo negro, ASCII blanco.</p>
    </a>
    <a class="card" href="p2/">
      <div class="num">P2</div>
      <h2>Módulo Generativo</h2>
      <p>Retícula de gráficos<br>estadísticos sintéticos.</p>
    </a>
    <a class="card pendiente" href="p3/">
      <div class="num">P3</div>
      <h2>Por definir</h2>
      <p>Tercera propuesta,<br>pendiente de concepto.</p>
    </a>
  </div>
</body>
</html>
